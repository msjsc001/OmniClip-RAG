[project]
name = "caelune"
version = "0.5.5"
description = "Caelune is a local-first desktop RAG for private Markdown, PDF, and Tika-backed knowledge bases."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
  { name = "EllisMorrow" }
]
keywords = ["rag", "markdown", "logseq", "sqlite", "lancedb", "desktop"]
dependencies = [
  "mcp>=1,<2",
  "pypdf>=5.0.0,<6.0.0",
]

[project.urls]
Repository = "https://github.com/EllisMorrow/Caelune"
Documentation = "https://ellismorrow.github.io/Caelune/"
